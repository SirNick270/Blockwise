<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Blockwise</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="w">
        <h1>Blockwise</h1>
        <div class="stat">Score<b id="score">0</b></div>
        <div class="stat">Record<b id="best">0</b></div>
        </header>
        <div id="board" class="w"></div>
        <div id="tray" class="w"></div>
        <div class="bar w">
        <span id="seed"></span>
        <span><button class="alt" id="daily">Daily game</button> <button id="new">New</button></span>
        </div>
        <div id="over" hidden>
        <b>Game over</b><span id="final"></span>
        <button id="again">Play again</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
